spring.application.name=fitness-monolith

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:fitnessdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PWD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration (override JWT_SECRET in production!)
jwt.secret=${JWT_SECRET:YS1zdHJpbmctc2VjcmV0LWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:172800000}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# ---- Spring Security (MOST IMPORTANT) ----
logging.level.org.springframework.security=DEBUG

# ---- Web / MVC ----
logging.level.org.springframework.web=DEBUG

# ---- Dispatcher & filters ----
logging.level.org.springframework.web.filter=DEBUG
