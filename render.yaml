services:
  - type: web
    name: fitness-api
    env: docker
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USER
        sync: false
      - key: DB_PWD
        sync: false
      - key: DB_URL
        sync: false
